<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProtegeEla offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #fff8fc;
        color: #241e23;
      }
      main {
        max-width: 560px;
        padding: 32px;
      }
      h1 {
        color: #6d245d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>O ProtegeEla não conseguiu acessar a internet agora. Se você estiver em perigo imediato, use também os canais oficiais de emergência disponíveis na sua região.</p>
      <p>Dados sensíveis, coordenadas exatas e tokens não são armazenados nesta página offline.</p>
    </main>
  </body>
</html>
